name: Nightly Full Suite

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

concurrency:
    group: nightly
    cancel-in-progress: true

jobs:
    full-e2e:
        name: Full E2E Suite
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            issues: write

        steps:
            - uses: actions/checkout@v4

            - name: Build image, start stack, create test user, install Playwright
              uses: ./.github/actions/e2e-stack
              with:
                  tag: nightly
                  container: kima-nightly
                  volume: kima_nightly_data

            - name: Run full E2E suite
              working-directory: frontend
              run: npx playwright test --reporter=list
              env:
                  KIMA_TEST_USERNAME: ${{ env.KIMA_TEST_USERNAME }}
                  KIMA_TEST_PASSWORD: ${{ env.KIMA_TEST_PASSWORD }}
                  KIMA_UI_BASE_URL: http://127.0.0.1:3030

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-report-${{ github.run_id }}
                  path: |
                      frontend/test-results/
                      frontend/playwright-report/
                  retention-days: 14

            - name: Open issue on failure
              if: failure()
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: `Nightly suite failed -- ${new Date().toISOString().split('T')[0]}`,
                        body: `The nightly E2E suite failed on ${context.sha}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                        labels: ['bug', 'ci']
                      });

            - name: Stop stack
              if: always()
              uses: ./.github/actions/e2e-teardown
              with:
                  container: kima-nightly
                  volume: kima_nightly_data
