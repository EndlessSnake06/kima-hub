name: Pre-release Image

# A pre-release image, pushed on purpose: push the `prerelease` branch or press
# Run workflow on the Actions tab. The image goes only to this repository's
# GitHub Container Registry; Docker Hub is reserved for version tags
# (docker-publish.yml). Both architectures are built so a release tag cut from
# the same commit is known to build on ARM as well.

on:
    push:
        branches: [prerelease]
    workflow_dispatch:
        inputs:
            tag_suffix:
                description: "Extra tag for this build, e.g. rc1 gives :prerelease-rc1"
                required: false
                type: string

concurrency:
    group: prerelease
    cancel-in-progress: true

jobs:
    build:
        name: Build & Push Pre-release (ghcr.io only)
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set image name
              run: |
                  OWNER="${{ github.repository_owner }}"
                  echo "GHCR_IMAGE=ghcr.io/${OWNER,,}/kima" >> $GITHUB_ENV

            # The image carries the ML models and a full Postgres, so a default
            # runner runs out of disk partway through the build.
            - name: Free up disk space
              run: |
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Get short SHA
              id: sha
              run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Compose tag list
              id: tags
              run: |
                  TAGS="${GHCR_IMAGE}:prerelease"$'\n'"${GHCR_IMAGE}:prerelease-${{ steps.sha.outputs.short }}"
                  if [ -n "${{ inputs.tag_suffix }}" ]; then
                    TAGS="${TAGS}"$'\n'"${GHCR_IMAGE}:prerelease-${{ inputs.tag_suffix }}"
                  fi
                  {
                    echo 'list<<TAGS_EOF'
                    echo "${TAGS}"
                    echo 'TAGS_EOF'
                  } >> $GITHUB_OUTPUT

            - name: Build and push pre-release
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ steps.tags.outputs.list }}
                  # The running app shows "<version>-prerelease" so it is never
                  # mistaken for a release.
                  build-args: |
                      NEXT_PUBLIC_BUILD_TYPE=prerelease
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=prerelease-${{ steps.sha.outputs.short }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

            - name: Summary
              run: |
                  {
                    echo "### Pre-release image published"
                    echo ""
                    echo "Both architectures built, so a release tag off this commit should build too."
                    echo ""
                    echo '```'
                    echo "docker pull ${GHCR_IMAGE}:prerelease-${{ steps.sha.outputs.short }}"
                    echo '```'
                  } >> $GITHUB_STEP_SUMMARY
